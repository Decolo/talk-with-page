<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code Bridge Test</title>
  <style>
    body {
      font-family: monospace;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    h1 { color: #4ec9b0; }
    .container { margin: 20px 0; }
    textarea {
      width: 100%;
      padding: 10px;
      font-family: monospace;
      background: #2d2d2d;
      color: #d4d4d4;
      border: 1px solid #4ec9b0;
      border-radius: 4px;
      min-height: 100px;
    }
    button {
      background: #4ec9b0;
      color: #1e1e1e;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
    }
    button:hover { background: #5fd4b5; }
    .log {
      background: #2d2d2d;
      padding: 15px;
      border: 1px solid #4ec9b0;
      border-radius: 4px;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 20px;
    }
    .status { color: #4ec9b0; }
    .error { color: #f48771; }
    .response { color: #dcdcaa; }
  </style>
</head>
<body>
  <h1>🌉 Claude Code Bridge Test</h1>

  <div class="container">
    <label>Command:</label>
    <textarea id="command" placeholder="Enter your instruction for Claude...">List all files in the current directory</textarea>
    <button onclick="sendCommand()">Send Command</button>
    <button onclick="sendPageContent()">Send Page Content</button>
    <button onclick="clearLog()">Clear Log</button>
  </div>

  <div class="log" id="log">
    <div class="status">Connecting to ws://127.0.0.1:9999...</div>
  </div>

  <script>
    let ws;
    const log = document.getElementById('log');

    function addLog(message, type = 'status') {
      const div = document.createElement('div');
      div.className = type;
      div.textContent = message;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function clearLog() {
      log.innerHTML = '';
    }

    function connect() {
      ws = new WebSocket('ws://127.0.0.1:9999');

      ws.onopen = () => {
        addLog('✅ Connected to Claude Code Bridge', 'status');
      };

      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);

        if (message.type === 'status') {
          addLog(`📊 Status: ${message.payload.status} - ${message.payload.message || ''}`, 'status');
        } else if (message.type === 'response') {
          addLog(`📥 Response: ${message.payload.content}`, 'response');
          if (message.payload.toolsUsed) {
            addLog(`🔧 Tools used: ${message.payload.toolsUsed.join(', ')}`, 'status');
          }
        }
      };

      ws.onerror = (error) => {
        addLog('❌ WebSocket error: ' + error, 'error');
      };

      ws.onclose = () => {
        addLog('🔌 Connection closed', 'error');
        setTimeout(connect, 2000);
      };
    }

    function sendCommand() {
      const instruction = document.getElementById('command').value;
      if (!instruction.trim()) return;

      const message = {
        type: 'command',
        id: 'web-' + Date.now(),
        timestamp: Date.now(),
        payload: {
          instruction: instruction
        }
      };

      addLog(`📤 Sending: ${instruction}`, 'status');
      ws.send(JSON.stringify(message));
    }

    function sendPageContent() {
      const message = {
        type: 'page_content',
        id: 'page-' + Date.now(),
        timestamp: Date.now(),
        payload: {
          url: window.location.href,
          title: document.title,
          content: document.body.innerText.substring(0, 1000),
          selectedText: window.getSelection().toString()
        }
      };

      addLog('📤 Sending page content', 'status');
      ws.send(JSON.stringify(message));
    }

    // Connect on load
    connect();
  </script>
</body>
</html>
